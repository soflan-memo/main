<title>ポケモンチャンピオンズ種族値別素早さ表</title>
<style>
  :root {
    background:#e0e0e0;
  }

  th{
    /*ヘッダー行は固定する*/
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  span.span-mega-pokemon{
    background: #f4f4f4;
  }

  span.span-normal-pokemon{
    background: #ffffff;
  }

  .td-speed{
    background: #f0f0f0;
  }

  .td-latestSpd{
    background: #e0e0e0;
  }

  .td-normalSpd{
    background: #f0f0f0;    
  }

  .td-semiSpd{
    background: #f0f0e0;
  }

  .td-fastestSpd{
    background: #f0e0e0;
  }

  .td-normalSpd15{
    background: #f8f8f8;
  }

  .td-semiSpd15{
    background: #f8f8e0;
  }

  .td-fastestSpd15{
    background: #f8e0e0;
  }

  .td-normalSpd20{
    background: #ffffff;
  }

  .td-semiSpd20{
    background: #ffffe0;
  }

  .td-fastestSpd20{
    background: #ffe8e8;
  }

  /* ポップオーバーウィンドウ本体 */
  .window {
    display: none;         /* 初期状態は非表示 */
    position: fixed;       /* 画面に対して絶対位置で配置（ドラッグ用） */
    background: #ffffff;   /* 下の文字が透けないように背景色は必須 */
    border: 1px solid #777;/* 境界がわかるように枠線 */
    max-height: 80vh;       /* 画面の高さの80%までに制限 */
    white-space: nowrap;   /* ポケモン名などが途中で改行・折りたたまれるのを防止 */
    overflow-y: auto;       /* はみ出た分はスクロール可能にする */
    -webkit-overflow-scrolling: touch; /* スマホでの滑らかなスクロール */
    /* 標準仕様（Firefox / 最新Chromeなど） */
    scrollbar-width: thin;
    scrollbar-color: #888 #f1f1f1;
    }
  
    /* WebKit系（iOS Safari / Android Chrome / PC Chrome）向けのスクロールバースタイル */
    .window::-webkit-scrollbar {
      -webkit-appearance: none;
      width: 6px;  /* スクロールバーの太さ */
    }
  
    .window::-webkit-scrollbar-track {
      background: #f1f1f1; /* スクロールバーのレール（背景） */
    }
  
    .window::-webkit-scrollbar-thumb {
      background-color: #888;  /* つまみ（バー本体）の色 */
      border-radius: 3px; /* バーの角の丸み */
    }
  
  @media (max-width: 768px) {/* スマホからなら画面の高さは40%までに制限 */
    .window {
      max-height: 40vh;
    }
  }

  /* ポップオーバー表示状態 */
  .window.is-open {
    display: block;        /* 開いた時に表示 */
  }

  /* ヘッダー（ドラッグ操作するバー） */
  .window-header {
    display: flex;
    justify-content: space-between; /*タイトルとボタンを両端に配置させる*/
    background: #e8e8e8;
    cursor: grab;          /* 掴めるカーソル */
    user-select: none;     /* ドラッグ中に文字選択されるのを防止（必須） */
    touch-action: none;    /* タッチ操作時に画面スクロールするのを防止（必須） */
  }

  /* ヘッダーを掴んでいる時のカーソル */
  .window-header:active {
    cursor: grabbing;
  }
</style>
